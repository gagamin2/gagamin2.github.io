baseURL = "https://gagamin2.github.io/"
locale = "zh-cn"
defaultContentLanguage = "zh-cn"
title = "gagamin2's Blog"
theme = "PaperMod"
enableRobotsTXT = true
hasCJKLanguage = true

[pagination]
  pagerSize = 10

[params]
  author = "gagamin2"
  defaultTheme = "auto"
  ShowReadingTime = true
  ShowShareButtons = true
  ShowPostNavLinks = true
  ShowBreadCrumbs = true
  ShowCodeCopyButtons = true
  ShowWordCount = true
  ShowRssButtonInSectionTermList = true
  UseHugoToc = true
  disableSpecial1stPost = false
  disableScrollToTop = false
  comments = false
  hidemeta = false
  hideSummary = false
  showtoc = false
  tocopen = false

  [params.homeInfoParams]
    Title = "你好，欢迎来到我的博客"
    Content = "这里记录我的学习笔记和技术分享。"

  [[params.socialIcons]]
    name = "github"
    url = "https://github.com/gagamin2"

  [[params.socialIcons]]
    name = "rss"
    url = "index.xml"

[outputs]
  home = ["HTML", "RSS", "JSON"]

[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true
  [markup.highlight]
    noClasses = false

[[menu.main]]
  name = "归档"
  url = "/archives/"
  weight = 10

[[menu.main]]
  name = "标签"
  url = "/tags/"
  weight = 20

[[menu.main]]
  name = "搜索"
  url = "/search/"
  weight = 30

[[menu.main]]
  name = "关于"
  url = "/about/"
  weight = 40